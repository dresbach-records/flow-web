<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">FLOW</title>
  <desc id="desc">Logotipo oficial FLOW com símbolo e gradiente azul, roxo, magenta e rosa</desc>
  <defs>
    <linearGradient id="flow-fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7FFF"/>
      <stop offset="33%" stop-color="#8B5CF6"/>
      <stop offset="66%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="flow-fgH" x1="0%" y1="0%" x2="100%" y2="0%">
